<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling Assignment</title>
    <style>
        /* iii. Background image and 3% margin for the page */
        body {
            background-image: url('Flower.png');
            margin: 3%;
        }

        /* i. Hover and active link background color set to green */
        a:hover, 
        a:active {
            background-color: green;
        }

        /* ii. Unordered list style set to square */
        ul {
            list-style-type: square;
        }

        /* iv. Dashed left/right borders and double top/bottom borders for a table */
        table {
            border-style: double dashed double dashed;
            border-width: 5px;
        }

        td {
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Link showing hover and active states (i) -->
    <p><a href="https://youtube.com/">Hover or click this link</a></p>

    <!-- Unordered list with square bullets (ii) -->
    <ul>
        <li>Rose</li>
        <li>Jasmine</li>
    </ul>

    <!-- Table with 2 rows and mixed borders (iv) -->
    <table>
        <tr>
            <td>Row 1, Cell 1</td>
            <td>Row 1, Cell 2</td>
        </tr>
        <tr>
            <td>Row 2, Cell 1</td>
            <td>Row 2, Cell 2</td>
        </tr>
    </table>

</body>
</html>
